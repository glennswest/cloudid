# stormd supervisor config for cloudid container
# stormd is PID 1, cloudid is a supervised child process

[general]
name = "cloudid"
# On the cloudid-data PVC — container-local /var is tmpfs on rose (RAM);
# logs there would fill the router's memory.
log_dir = "/var/lib/cloudid/logs"

[api]
bind = "0.0.0.0:9080"

[ssh]
enabled = true
bind = "0.0.0.0:22"
host_key = "/var/stormd/host_key"
password = "stormd"

[stormlog.terminal]
rows = 50
cols = 200
scrollback = 10000

# Without this, stormlog's file writer defaults to /var/log/stormd, which
# doesn't exist in the scratch image — every child stdout line then emits a
# "failed to open log file" ERROR, flooding the RouterOS host log.
# Logs live on the cloudid-data PVC (mounted at /var/lib/cloudid) so they
# survive container recreation; the directory skeleton is baked into the image.
[stormlog.file]
log_dir = "/var/lib/cloudid/logs"

[[process]]
name = "cloudid"
command = "/cloudid"
args = ["serve", "--config", "/etc/cloudid/config.toml"]
on_failure = "restart"
restart_delay_secs = 5
max_restarts = 100
restart_window_secs = 3600
